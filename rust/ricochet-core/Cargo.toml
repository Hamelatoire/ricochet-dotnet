
[package]
name = "ricochet-core"
version = "0.0.0"
edition = "2024"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order", "raw_value"] }
chrono = { version = "0.4", default-features = false, features = ["std", "clock", "serde"] }
uuid = { version = "1", features = ["v4"] }
regex = "1"
rand = "0.9"
zip = { version = "9.5.0", default-features = false, features = ["deflate"] }
md-5 = "0.11.0"
sha1 = "0.11.0"
sha2 = "0.11.1"
hmac = "0.13.0"
base64 = "0.23.1"
url = "2.5.8"

[dev-dependencies]
pretty_assertions = "1"
