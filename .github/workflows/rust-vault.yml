name: Rust vault

# Tests the Secrets vault of the Rust port on each OS it has a store for (ADR 0092). Runs only on pull requests into
# main, like pr.yml. It is not a required check yet: add it to the ruleset once it has passed on main.
on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: rust-vault-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  vault:
    name: Vault ${{ matrix.os }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            os: windows
          - runner: macos-latest
            os: macos
          - runner: ubuntu-latest
            os: linux
    defaults:
      run:
        shell: bash
        working-directory: rust/ricochet-core

    steps:
      - uses: actions/checkout@v5

      - name: Install a Secret Service and a keyring (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y gnome-keyring libsecret-1-0 libsecret-tools dbus-x11

      # The Secret Service only exists inside a session bus, so run the tests in one. The keyring is unlocked with a
      # throwaway password, so the default collection exists for the tests to use. An empty password makes
      # gnome-keyring ask a prompter, which cannot show without a display, and the `login` collection is never created
      # ("Object does not exist at path /org/freedesktop/secrets/collection/login").
      - name: Test the vault with an unlocked keyring (Linux)
        if: runner.os == 'Linux'
        run: |
          dbus-run-session -- bash -c '
            set -e
            printf "ci-throwaway" | gnome-keyring-daemon --unlock --components=secrets >/dev/null
            # Storing one item creates the default collection, which the vault uses. Remove it again afterwards.
            printf "warm-up" | secret-tool store --label="ricochet ci warm-up" service ci account warm-up
            secret-tool clear service ci account warm-up
            cargo test --test secrets --test secrets_os
          '

      - name: Test the vault (Windows and macOS)
        if: runner.os != 'Linux'
        run: cargo test --test secrets --test secrets_os
