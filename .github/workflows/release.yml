name: Release

# Pushing a tag such as v0.1.0 builds every platform and publishes a GitHub release.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.rid }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
          - os: ubuntu-latest
            rid: linux-x64
          - os: macos-latest
            rid: osx-arm64
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Install the native linker
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y clang zlib1g-dev

      - name: Test
        run: dotnet test --project tests/Ricochet.Core.Tests -c Release

      - name: Publish
        run: |
          dotnet publish src/Ricochet.App -c Release -r ${{ matrix.rid }} -o out/app
          dotnet publish src/Ricochet.Cli -c Release -r ${{ matrix.rid }} -o out/cli

      - name: Check the CLI starts
        run: out/cli/ricochet --help

      # The app and the CLI are packaged apart: their names differ only by case,
      # so they would collide in one folder on Windows and macOS.
      - name: Package
        run: |
          mkdir dist
          for part in app cli; do
            cd "out/$part"
            rm -rf ./*.pdb ./*.dbg ./*.dSYM
            name="ricochet-$part-$GITHUB_REF_NAME-${{ matrix.rid }}"
            if [ "$RUNNER_OS" = "Windows" ]; then
              7z a "$GITHUB_WORKSPACE/dist/$name.zip" ./*
            else
              tar -czf "$GITHUB_WORKSPACE/dist/$name.tar.gz" ./*
            fi
            cd "$GITHUB_WORKSPACE"
          done

      - uses: actions/upload-artifact@v5
        with:
          name: ${{ matrix.rid }}
          path: dist/*
          if-no-files-found: error

  release:
    name: Publish the release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          path: dist
          merge-multiple: true

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            --verify-tag
