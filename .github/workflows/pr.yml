name: Pull request

# Checks that a pull request tests and builds on every platform a release supports.
on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  check:
    name: Check ${{ matrix.rid }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
          - os: ubuntu-latest
            rid: linux-x64
          - os: macos-latest
            rid: osx-arm64
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5

      - name: Install the Linux libraries the window needs
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-x11-dev libwayland-dev libvulkan-dev libxcb1-dev libfontconfig1-dev libasound2-dev libssl-dev

      - name: Install a Secret Service and a keyring (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get install -y gnome-keyring libsecret-1-0 libsecret-tools dbus-x11

      # The core tests include the Secret vault tests (ADR 0092), which use each OS's real store. On Linux the Secret
      # Service only exists inside a session bus, so run them in one. The keyring is unlocked with a throwaway
      # password, so the default collection exists for the tests to use. An empty password makes gnome-keyring ask a
      # prompter, which cannot show without a display, and the `login` collection is never created.
      - name: Test the core (Linux)
        if: runner.os == 'Linux'
        run: |
          dbus-run-session -- bash -c '
            set -e
            printf "ci-throwaway" | gnome-keyring-daemon --unlock --components=secrets >/dev/null
            # Storing one item creates the default collection, which the vault uses. Remove it again afterwards.
            printf "warm-up" | secret-tool store --label="ricochet ci warm-up" service ci account warm-up
            secret-tool clear service ci account warm-up
            cargo test --locked --manifest-path rust/ricochet-core/Cargo.toml
          '

      - name: Test the core (Windows and macOS)
        if: runner.os != 'Linux'
        run: cargo test --locked --manifest-path rust/ricochet-core/Cargo.toml

      - name: Test and build the command line
        run: |
          cargo test --locked --manifest-path rust/ricochet-cli/Cargo.toml
          cargo build --release --locked --manifest-path rust/ricochet-cli/Cargo.toml
          rust/target/release/ricochet --help

      - name: Test and build the app
        run: |
          cargo test --locked --manifest-path rust/ricochet-app/Cargo.toml
          cargo build --release --locked --manifest-path rust/ricochet-app/Cargo.toml

      # The installer is built here too, so a change that breaks it is found before it merges.
      - name: Build the Windows installer
        if: runner.os == 'Windows'
        env:
          MSYS_NO_PATHCONV: "1"
        run: |
          mkdir -p out/app out/cli
          cp rust/target/release/ricochet-app.exe out/app/Ricochet.exe
          cp rust/target/release/ricochet.exe out/cli/ricochet.exe
          choco install innosetup --no-progress -y
          "/c/Program Files (x86)/Inno Setup 6/ISCC.exe" "/DAppVersion=0.0.0" installer/ricochet.iss
